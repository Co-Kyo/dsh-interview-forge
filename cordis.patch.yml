# InterviewForge 速练 bundle 补丁：把自己的插件行挂进任一 profile。
# 由 package.json#dsh.bundle.patch 引用，profile 叠加本层后，loader 在 profile 的
# node_modules 中按包名解析并实例化 dsh-interview-forge，从而随 dsh 启动加载。
- insert:
    # host 半边：注册 InterviewForge 工具（出题 / 报告就绪 / 结果）。
    # 实时 client 数据通路（list/snapshot/answer/finish/...）由 TypertRemoteService
    # 暴露为公开 Remote 服务，client 半边通过 ctx.remote 调用（见 lib/forge-gateway.js）。
    - id: interview-forge
      name: dsh-interview-forge

    # client 半边无需 loader entry：package.json 的 dsh.client 声明会被
    # @deepseek-ai/dsh-client-modules 自动扫描并服务 lib/client.js 给浏览器。
    # 在这里再插一个指向包主入口的 entry 会导致 forge_* 工具重复注册。
